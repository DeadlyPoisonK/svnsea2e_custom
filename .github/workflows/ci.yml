name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Built bundle is up to date
        run: git diff --exit-code -- svnsea2e.mjs || (echo "::error::svnsea2e.mjs is out of date, run npm run build and commit it" && exit 1)
